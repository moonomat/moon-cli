# Checks the launcher and that it can still fetch, verify and start the live CLI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check moon.js
      - run: npm pack --dry-run
      - run: npm install --no-audit --no-fund
      - run: node --input-type=module -e "await import('puppeteer-core'); await import('webgpu')"
      - run: node moon.js --help
